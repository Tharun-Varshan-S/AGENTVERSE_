<svg viewBox="0 0 1200 1220" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="agentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="agentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="agentGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="agentGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="agentGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="250" y="30" width="700" height="60" rx="12" fill="url(#headerGrad)" />
  <text x="600" y="55" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">CivicResolve AI Architecture</text>
  <text x="600" y="78" fill="#93c5fd" font-size="13" font-weight="500" text-anchor="middle">AI-Powered Civic Complaint Resolution System</text>

  <!-- 1. Citizen Portal -->
  <rect x="200" y="120" width="800" height="75" rx="10" fill="url(#portalGrad)" stroke="#3b82f6" stroke-width="2" />
  <text x="600" y="150" fill="#60a5fa" font-size="18" font-weight="700" text-anchor="middle">Citizen Portal</text>
  <text x="600" y="175" fill="#94a3b8" font-size="14" text-anchor="middle">Web App • Mobile • Photo • Voice • Text • Location (GPS / OSM Reverse Geocoding)</text>

  <!-- Arrow 1 -->
  <line x1="600" y1="195" x2="600" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. API Gateway / Backend -->
  <rect x="200" y="235" width="800" height="75" rx="10" fill="url(#portalGrad)" stroke="#0d9488" stroke-width="2" />
  <text x="600" y="265" fill="#2dd4bf" font-size="18" font-weight="700" text-anchor="middle">API Gateway / Backend Services</text>
  <text x="600" y="290" fill="#94a3b8" font-size="14" text-anchor="middle">Authentication • Input Sanitization • File Upload • Rate Limiting</text>

  <!-- Arrow 2 -->
  <line x1="600" y1="310" x2="600" y2="345" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Orchestrator (LangGraph / Pipeline) -->
  <rect x="200" y="350" width="800" height="90" rx="10" fill="url(#portalGrad)" stroke="#8b5cf6" stroke-width="2" />
  <text x="600" y="380" fill="#c084fc" font-size="18" font-weight="700" text-anchor="middle">Orchestrator (LangGraph Engine)</text>
  <text x="600" y="405" fill="#94a3b8" font-size="14" text-anchor="middle">Executes Agents • Maintains Incident State • Validates Outputs (Zod) • Workflow Control</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="440" x2="600" y2="475" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Shared Incident Object Badge -->
  <rect x="300" y="475" width="600" height="50" rx="25" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2" />
  <text x="600" y="497" fill="#fbbf24" font-size="15" font-weight="700" text-anchor="middle">Shared Incident Object</text>
  <text x="600" y="515" fill="#d97706" font-size="12" font-weight="500" text-anchor="middle">(Single Source of Truth / LangGraph State Annotation)</text>

  <!-- Fan-out Arrows to 5 Agents -->
  <line x1="600" y1="525" x2="145" y2="570" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="600" y1="525" x2="380" y2="570" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="600" y1="525" x2="600" y2="570" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <line x1="600" y1="525" x2="820" y2="570" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="600" y1="525" x2="1055" y2="570" stroke="#f87171" stroke-width="2" marker-end="url(#arrowOrange)" />

  <!-- 5 Multi-Agents Cards -->
  <!-- Agent 1: Intake -->
  <rect x="40" y="570" width="210" height="135" rx="10" fill="url(#agentGrad1)" stroke="#3b82f6" stroke-width="2" />
  <text x="145" y="598" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">Intake Agent</text>
  <line x1="60" y1="608" x2="230" y2="608" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2" />
  <text x="145" y="630" fill="#cbd5e1" font-size="12" text-anchor="middle">Extract Category</text>
  <text x="145" y="648" fill="#cbd5e1" font-size="12" text-anchor="middle">OSM Reverse Geocoding</text>
  <text x="145" y="666" fill="#cbd5e1" font-size="12" text-anchor="middle">Confidence Score</text>
  <text x="145" y="684" fill="#cbd5e1" font-size="12" text-anchor="middle">Priority &amp; Intent</text>

  <!-- Agent 2: Routing -->
  <rect x="275" y="570" width="210" height="135" rx="10" fill="url(#agentGrad2)" stroke="#10b981" stroke-width="2" />
  <text x="380" y="598" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">Routing Agent</text>
  <line x1="295" y1="608" x2="465" y2="608" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" />
  <text x="380" y="630" fill="#cbd5e1" font-size="12" text-anchor="middle">Ward Database Match</text>
  <text x="380" y="648" fill="#cbd5e1" font-size="12" text-anchor="middle">Find Department</text>
  <text x="380" y="666" fill="#cbd5e1" font-size="12" text-anchor="middle">Calculate Severity</text>
  <text x="380" y="684" fill="#cbd5e1" font-size="12" text-anchor="middle">Assign SLA Target</text>

  <!-- Agent 3: Drafting -->
  <rect x="510" y="570" width="210" height="135" rx="10" fill="url(#agentGrad3)" stroke="#a855f7" stroke-width="2" />
  <text x="615" y="598" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">Drafting Agent</text>
  <line x1="530" y1="608" x2="700" y2="608" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2" />
  <text x="615" y="630" fill="#cbd5e1" font-size="12" text-anchor="middle">LLM Letter Draft</text>
  <text x="615" y="648" fill="#cbd5e1" font-size="12" text-anchor="middle">Structured Output</text>
  <text x="615" y="666" fill="#cbd5e1" font-size="12" text-anchor="middle">Reference Number</text>
  <text x="615" y="684" fill="#cbd5e1" font-size="12" text-anchor="middle">Formal Tone &amp; Body</text>

  <!-- Agent 4: Submission & Tracking -->
  <rect x="745" y="570" width="210" height="135" rx="10" fill="url(#agentGrad4)" stroke="#06b6d4" stroke-width="2" />
  <text x="850" y="598" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">Submission &amp; Tracking</text>
  <line x1="765" y1="608" x2="935" y2="608" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2" />
  <text x="850" y="630" fill="#cbd5e1" font-size="12" text-anchor="middle">Submit Complaint</text>
  <text x="850" y="648" fill="#cbd5e1" font-size="12" text-anchor="middle">Track Lifecycle</text>
  <text x="850" y="666" fill="#cbd5e1" font-size="12" text-anchor="middle">Update Status</text>
  <text x="850" y="684" fill="#cbd5e1" font-size="12" text-anchor="middle">Acknowledge Receipt</text>

  <!-- Agent 5: Escalation -->
  <rect x="980" y="570" width="210" height="135" rx="10" fill="url(#agentGrad5)" stroke="#ef4444" stroke-width="2" />
  <text x="1085" y="598" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">Escalation Agent</text>
  <line x1="1000" y1="608" x2="1170" y2="608" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
  <text x="1085" y="630" fill="#cbd5e1" font-size="12" text-anchor="middle">Check SLA Breach</text>
  <text x="1085" y="648" fill="#cbd5e1" font-size="12" text-anchor="middle">Auto-Escalation</text>
  <text x="1085" y="666" fill="#cbd5e1" font-size="12" text-anchor="middle">Notify Stakeholders</text>
  <text x="1085" y="684" fill="#cbd5e1" font-size="12" text-anchor="middle">Higher Authority Alert</text>

  <!-- Convergence Arrows to External Govt Layer -->
  <line x1="145" y1="705" x2="600" y2="745" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="380" y1="705" x2="600" y2="745" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="615" y1="705" x2="600" y2="745" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="850" y1="705" x2="600" y2="745" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1085" y1="705" x2="600" y2="745" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6. External Government Layer -->
  <rect x="200" y="745" width="800" height="75" rx="10" fill="url(#portalGrad)" stroke="#f97316" stroke-width="2" />
  <text x="600" y="775" fill="#fb923c" font-size="18" font-weight="700" text-anchor="middle">External Government Integration Layer</text>
  <text x="600" y="800" fill="#94a3b8" font-size="14" text-anchor="middle">Municipality APIs • Mock Government Portals • Dispatch Email / SMS Gateway</text>

  <!-- Arrow 5 -->
  <line x1="600" y1="820" x2="600" y2="855" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7. Citizen Dashboard -->
  <rect x="200" y="855" width="800" height="75" rx="10" fill="url(#portalGrad)" stroke="#3b82f6" stroke-width="2" />
  <text x="600" y="885" fill="#60a5fa" font-size="18" font-weight="700" text-anchor="middle">Citizen Dashboard</text>
  <text x="600" y="910" fill="#94a3b8" font-size="14" text-anchor="middle">Complaint Status • Interactive Timeline • Push Notifications • Resolution Verification</text>

  <!-- 8. Supporting Infrastructure Services Section -->
  <rect x="40" y="965" width="1150" height="225" rx="12" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  <text x="600" y="995" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Supporting Infrastructure Services</text>

  <!-- Service 1: MongoDB -->
  <rect x="65" y="1015" width="250" height="150" rx="8" fill="url(#portalGrad)" stroke="#10b981" stroke-width="2" />
  <text x="190" y="1045" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">MongoDB Database</text>
  <text x="190" y="1075" fill="#94a3b8" font-size="13" text-anchor="middle">Incident Objects</text>
  <text x="190" y="1098" fill="#94a3b8" font-size="13" text-anchor="middle">Complaint History</text>
  <text x="190" y="1121" fill="#94a3b8" font-size="13" text-anchor="middle">Department Ward Mapping</text>

  <!-- Service 2: LLM API Service -->
  <rect x="345" y="1015" width="250" height="150" rx="8" fill="url(#portalGrad)" stroke="#60a5fa" stroke-width="2" />
  <text x="470" y="1045" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">LLM API Service</text>
  <text x="470" y="1075" fill="#94a3b8" font-size="13" text-anchor="middle">Google Gemini 3.6 Flash</text>
  <text x="470" y="1098" fill="#94a3b8" font-size="13" text-anchor="middle">Structured Outputs API</text>
  <text x="470" y="1121" fill="#94a3b8" font-size="13" text-anchor="middle">Runtime Zod Validation</text>

  <!-- Service 3: Scheduler Cron -->
  <rect x="625" y="1015" width="250" height="150" rx="8" fill="url(#portalGrad)" stroke="#f97316" stroke-width="2" />
  <text x="750" y="1045" fill="#fb923c" font-size="16" font-weight="700" text-anchor="middle">Scheduler (Cron Engine)</text>
  <text x="750" y="1075" fill="#94a3b8" font-size="13" text-anchor="middle">SLA Deadline Monitor</text>
  <text x="750" y="1098" fill="#94a3b8" font-size="13" text-anchor="middle">Automated Escalation</text>
  <text x="750" y="1121" fill="#94a3b8" font-size="13" text-anchor="middle">System Health Check</text>

  <!-- Service 4: Notification Service -->
  <rect x="905" y="1015" width="250" height="150" rx="8" fill="url(#portalGrad)" stroke="#c084fc" stroke-width="2" />
  <text x="1030" y="1045" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">Notification Service</text>
  <text x="1030" y="1075" fill="#94a3b8" font-size="13" text-anchor="middle">Nodemailer Email Gateway</text>
  <text x="1030" y="1098" fill="#94a3b8" font-size="13" text-anchor="middle">SMS Alert Integration</text>
  <text x="1030" y="1121" fill="#94a3b8" font-size="13" text-anchor="middle">Real-time Webhook Dispatch</text>
</svg>